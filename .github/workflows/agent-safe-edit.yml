name: Safe inventory supplier edit

on:
  push:
    branches:
      - agent-inventory-supplier-fix

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          inventory = Path("src/routes/admin.inventory.new.tsx")
          text = inventory.read_text()

          old = '''  const selectExistingInventory = (itemIndex: number, inventoryItem: (typeof inventoryItems)[number]) => {
            updateItem(itemIndex, {
              selectedInventoryId: inventoryItem.id,
              productName: inventoryItem.productName,
              productSearch: inventoryItem.productName,
              variants: [
                createVariantDraft({
                  unit: inventoryItem.unit,
                  price: String(inventoryItem.purchasePrice),
                }),
              ],
            });
          };'''
          new = '''  const selectExistingInventory = (itemIndex: number, inventoryItem: (typeof inventoryItems)[number]) => {
            updateItem(itemIndex, {
              selectedInventoryId: inventoryItem.id,
              productName: inventoryItem.productName,
              productSearch: inventoryItem.productName,
              variants: [
                createVariantDraft({
                  unit: inventoryItem.unit,
                  price: String(inventoryItem.purchasePrice),
                }),
              ],
            });
            if (!supplierId) setSupplierId(inventoryItem.supplierId);
          };'''
          if old not in text:
              raise SystemExit("Expected inventory selection block was not found")
          text = text.replace(old, new, 1)

          unit_old = '''                                  placeholder="bags / kg / L"
                                />'''
          unit_new = '''                                  placeholder="bags / kg / L"
                                  disabled={Boolean(item.selectedInventoryId)}
                                />'''
          if unit_old not in text:
              raise SystemExit("Expected unit input was not found")
          text = text.replace(unit_old, unit_new, 1)

          price_old = '''                                  placeholder="1200"
                                />'''
          price_new = '''                                  placeholder="1200"
                                  disabled={Boolean(item.selectedInventoryId)}
                                />'''
          if price_old not in text:
              raise SystemExit("Expected purchase price input was not found")
          text = text.replace(price_old, price_new, 1)

          inventory.write_text(text)

          ledger = Path("src/routes/admin.ledger.suppliers.$supplierId.tsx")
          text = ledger.read_text()

          table_import = '''import {
  Table,
  TableBody,
  TableCell,
  TableHead,
  TableHeader,
  TableRow,
} from "@/components/ui/table";
'''
          if table_import not in text:
              raise SystemExit("Expected supplier table import was not found")
          text = text.replace(table_import, "", 1)

          start_marker = '      <div className="grid gap-6 lg:grid-cols-[1.25fr_0.75fr]">'
          end_marker = '      <Dialog open={whatsappOpen}'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Expected supplier purchase-history section was not found")

          replacement = '      <SupplierTransactionTimeline entries={sorted} />\n\n'
          text = text[:start] + replacement + text[end:]
          ledger.write_text(text)
          PY

          rm -f .github/workflows/agent-safe-edit.yml

          git diff --check
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sort | tr '\n' ',' )" = "src/routes/admin.inventory.new.tsx,src/routes/admin.ledger.suppliers.$supplierId.tsx," \
            || { echo "Unexpected changed files"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit final files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.inventory.new.tsx 'src/routes/admin.ledger.suppliers.$supplierId.tsx'
          git commit -m "feat: improve supplier-linked inventory and timeline"
          git push origin HEAD:agent-inventory-supplier-fix
