name: Temporary inventory loader fix

on:
  push:
    branches:
      - fix/inventory-loader-cms-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale CMS loader entries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/shop-store.ts")
          text = path.read_text()
          old = text
          text = text.replace('  cmsSections,\n  ads,\n  backupRows,', '  backupRows,')
          text = text.replace('        reminderLogs,\n        cmsSections,\n        ads,\n        backupRows,', '        reminderLogs,\n        backupRows,')
          if text == old:
              raise SystemExit("Expected stale CMS loader entries were not found")
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/lib/shop-store.ts
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/shop-store.ts
          git rm .github/workflows/fix-inventory-loader.yml
          git commit -m "fix: align shop data loader results"
          git push
